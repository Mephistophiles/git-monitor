name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Ensure supported Git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git
          git --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Source coverage (including worker processes)
        run: python3 scripts/coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-coverage
          path: |
            target/coverage/coverage.json
            target/coverage/html/
          if-no-files-found: warn
      - run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Fresh offline browser report
        run: |
          python3 scripts/demo.py --binary target/release/git-monitor
          node scripts/screenshots.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            docs/example-report.html
            docs/report-*.png

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - run: cargo check --all-targets --locked
