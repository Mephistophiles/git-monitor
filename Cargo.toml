[package]
name = "git-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Multi-remote Git monitoring with scoped offline HTML digests"
license = "MIT"
repository = "https://github.com/Mephistophiles/git-monitor"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
humantime = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = { version = "2.7", features = ["inline", "bytes"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "baseline"
harness = false

[profile.release]
strip = true
